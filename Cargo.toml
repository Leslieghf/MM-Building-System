[package]
name = "madmax-bootstrap"
version = "0.1.0"
edition = "2024"
publish = false

[lints.clippy]
too_many_lines = "warn"

[lib]
name = "madmax_bootstrap"
crate-type = ["cdylib"]

[[bin]]
name = "trace_xref_probe"
path = "tools/xref_probe/main.rs"

[dependencies]
hudhook = { version = "=0.9.3", default-features = false, features = ["dx11"] }
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
rhai = { version = "=1.27.0", default-features = false, features = ["std", "sync", "no_module"] }

serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde"] }
